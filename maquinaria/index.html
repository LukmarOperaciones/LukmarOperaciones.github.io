<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Planificación Maquinaria — Lukmar</title>
<style>
:root{
  --lb:#2B5EA7;--lbd:#1a3d70;--lbl:#e8f0fb;--lbm:#5b82c4;
  --lo:#D4712A;--lol:#fdf0e8;--lod:#9c4f18;
  --gn:#1a7a4a;--gnl:#e8f7ee;--gnd:#0d4a2a;--gnm:#4caf78;
  --am:#e6a817;--aml:#fef8e7;--amd:#7a5500;
  --rd:#c0392b;--rdl:#fdf0ef;--rdd:#7a1f18;
  --gy:#6b7280;--gyl:#f3f4f6;--gyb:#e5e7eb;
  --tx:#111827;--mu:#6b7280;--bg:#f8fafc;--sf:#fff;
  --r:8px;--rl:14px;--fn:'Segoe UI',system-ui,sans-serif;
  --sh:0 1px 3px rgba(0,0,0,.08);--shm:0 4px 12px rgba(0,0,0,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fn);font-size:14px;background:var(--bg);color:var(--tx)}
.topbar{background:var(--lbd);color:#fff;display:flex;align-items:stretch;box-shadow:var(--shm)}
.tl{display:flex;align-items:center;gap:10px;padding:.6rem 1.2rem;border-right:1px solid rgba(255,255,255,.15)}
.lsvg{width:38px;height:38px;flex-shrink:0}
.tm{flex:1;display:flex;align-items:center;justify-content:space-between;padding:.6rem 1.2rem}
.tt h1{font-size:14px;font-weight:700}
.tt .sub{font-size:10px;opacity:.7;margin-top:1px}
.ta{display:flex;gap:6px;align-items:center}
.si{font-size:10px;color:rgba(255,255,255,.65);white-space:nowrap;transition:opacity 1s;opacity:0}
.nav{background:var(--lb);display:flex;gap:0;overflow-x:auto;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.nb{padding:10px 13px;border:none;background:transparent;font-size:11px;color:rgba(255,255,255,.75);cursor:pointer;white-space:nowrap;font-family:var(--fn);font-weight:500;border-bottom:3px solid transparent;transition:all .15s}
.nb:hover{color:#fff;background:rgba(255,255,255,.08)}
.nb.active{color:#fff;border-bottom-color:var(--lo);background:rgba(255,255,255,.1);font-weight:700}
.main{padding:1.1rem 1.3rem;max-width:1280px}
.card{background:var(--sf);border-radius:var(--rl);border:1px solid var(--gyb);padding:1rem 1.15rem;margin-bottom:10px;box-shadow:var(--sh)}
.ct{font-size:10px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.7rem}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--sf);border-radius:var(--rl);padding:1rem 1.1rem;box-shadow:var(--sh);border:1px solid var(--gyb);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kpi.kb::before{background:var(--lb)}.kpi.ko::before{background:var(--lo)}
.kpi.kg::before{background:var(--gn)}.kpi.ka::before{background:var(--am)}.kpi.kr::before{background:var(--rd)}
.kpi .ico{font-size:22px;margin-bottom:6px}
.kpi .val{font-size:26px;font-weight:800;line-height:1}
.kpi .lbl{font-size:10px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
.kpi .tr{font-size:10px;color:var(--mu);margin-top:3px}
.kpi .dl{font-size:10px;font-weight:600;margin-top:4px}
.pb{height:5px;border-radius:3px;background:var(--gyb);overflow:hidden;margin-top:6px}
.pf{height:100%;border-radius:3px}
.sbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--gyb)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.maq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.mc{background:var(--sf);border:2px solid var(--gyb);border-radius:var(--rl);padding:.85rem 1rem;cursor:pointer;transition:all .15s;box-shadow:var(--sh)}
.mc:hover{border-color:var(--lb);box-shadow:var(--shm)}.mc.sel{border-color:var(--lb);background:var(--lbl)}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:4px}
.pc{border-radius:var(--r);padding:5px 6px;cursor:pointer;border:1.5px solid var(--gyb);background:var(--sf);transition:transform .1s;position:relative;min-height:42px}
.pc:hover{transform:translateY(-1px);box-shadow:var(--sh)}
.pc .pid{font-size:10px;font-weight:700}.pc .pha{font-size:9px;color:var(--mu)}
.pc .pdot{width:5px;height:5px;border-radius:50%;position:absolute;top:4px;right:4px}
.pc.listo{background:var(--gnl);border-color:var(--gnm)}.pc.listo .pid{color:var(--gnd)}
.pc.proceso{background:var(--aml);border-color:var(--am)}.pc.proceso .pid{color:var(--amd)}
.pc.pendiente{background:var(--rdl);border-color:var(--rd)}.pc.pendiente .pid{color:var(--rdd)}
.pc.planif{background:var(--lbl);border-color:var(--lbm)}.pc.planif .pid{color:var(--lbd)}
.dl2{background:var(--gn)}.dp{background:var(--am)}.dn{background:var(--rd)}.dpl{background:var(--lb)}
.bdg{display:inline-block;padding:2px 6px;border-radius:8px;font-size:10px;font-weight:700}
.bgl{background:var(--gnl);color:var(--gnd)}.bgp{background:var(--aml);color:var(--amd)}
.bgn{background:var(--rdl);color:var(--rdd)}.bgpl{background:var(--lbl);color:var(--lbd)}
.bgpr{background:var(--gnl);color:var(--gnd)}.bgal{background:var(--lol);color:var(--lod)}
.leg{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:7px}
.li{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--mu)}
.ld{width:7px;height:7px;border-radius:50%}
.btn{padding:6px 12px;border-radius:var(--r);border:1px solid var(--gyb);background:var(--sf);font-size:11px;cursor:pointer;font-family:var(--fn);color:var(--tx);font-weight:500;transition:all .15s}
.btn:hover{background:var(--gyl)}.btnp{background:var(--lb);border-color:var(--lb);color:#fff}
.btnp:hover{background:var(--lbd)}.btno{background:var(--lo);border-color:var(--lo);color:#fff}
.btno:hover{background:var(--lod)}.btnd{background:var(--rdl);border-color:var(--rd);color:var(--rdd)}
.brow{display:flex;gap:7px;justify-content:flex-end;margin-top:12px}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:flex-start;justify-content:center;padding-top:25px;overflow-y:auto}
.ov.open{display:flex}
.mb{background:var(--sf);border-radius:var(--rl);padding:1.3rem;width:480px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mb h2{font-size:15px;font-weight:700;margin-bottom:11px;color:var(--lbd)}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:block;font-size:10px;color:var(--mu);font-weight:700;margin:8px 0 3px;text-transform:uppercase;letter-spacing:.04em}
input,select,textarea{width:100%;padding:7px 9px;border:1.5px solid var(--gyb);border-radius:var(--r);font-size:12px;font-family:var(--fn);background:var(--bg);color:var(--tx);transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--lb)}
textarea{height:52px;resize:none}
table{width:100%;border-collapse:collapse;font-size:11px}
th{text-align:left;padding:7px 9px;font-size:9px;color:var(--mu);font-weight:700;text-transform:uppercase;letter-spacing:.06em;border-bottom:2px solid var(--gyb);white-space:nowrap}
td{padding:6px 9px;border-bottom:1px solid var(--gyb);vertical-align:middle}
tr:last-child td{border:none}
tr:hover td{background:var(--gyl)}
.tov{overflow-x:auto}
.stl{font-size:10px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.07em;margin:.85rem 0 .4rem}
.fb{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:9px}
.fbt{padding:3px 10px;border-radius:14px;border:1px solid var(--gyb);background:transparent;font-size:11px;cursor:pointer;font-family:var(--fn);color:var(--mu);font-weight:500}
.fbt.active{background:var(--lb);color:#fff;border-color:var(--lb)}
.fl{display:flex}.jb{justify-content:space-between}.ac{align-items:center}.g8{gap:8px}.g6{gap:6px}
.empty{text-align:center;padding:2rem;color:var(--mu);font-size:12px}
.apool{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:3px;max-height:160px;overflow-y:auto;padding:5px;background:var(--bg);border:1.5px solid var(--gyb);border-radius:var(--r);margin-top:5px}
.ai{padding:4px 5px;border-radius:4px;font-size:10px;cursor:pointer;background:var(--sf);border:1px solid var(--gyb);text-align:center;transition:all .1s}
.ai:hover{background:var(--lbl);border-color:var(--lb);color:var(--lbd);font-weight:700}
.day-cols{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.day-col{border:1.5px solid var(--gyb);border-radius:var(--rl);overflow:hidden}
.day-col.tc{border-color:var(--lo);box-shadow:0 0 0 2px rgba(212,113,42,.2)}
.day-col.pc2{border-color:var(--rd)}.day-col.wc{border-color:var(--lb)}
.day-hdr{padding:5px 7px;font-size:10px;border-bottom:1px solid var(--gyb);background:var(--gyl)}
.day-body{padding:5px 7px;cursor:pointer;min-height:70px;transition:background .1s}
.day-body:hover{background:var(--lbl)}
.dtag{display:block;font-size:9px;padding:2px 5px;border-radius:4px;margin-bottom:2px;font-weight:700}
.dt-t{background:var(--gnl);color:var(--gnd)}.dt-p{background:var(--rdl);color:var(--rdd)}
.avb{background:var(--gyb);border-radius:3px;height:6px;overflow:hidden;margin-top:3px}
.avbf{height:100%;border-radius:3px}
.egrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-height:160px;overflow-y:auto;padding:4px;background:var(--bg);border:1px solid var(--gyb);border-radius:var(--r)}
.eopt{font-size:20px;text-align:center;padding:5px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:all .1s}
.eopt:hover{background:var(--gyl)}.eopt.eon{border-color:var(--lb);background:var(--lbl)}
.cost-kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.ck{background:var(--sf);border:1px solid var(--gyb);border-radius:var(--rl);padding:.8rem 1rem;box-shadow:var(--sh);border-top:3px solid var(--lb)}
.ck .cv{font-size:20px;font-weight:800;color:var(--lb)}.ck .cl{font-size:10px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
.mant-al{background:var(--aml);border:1px solid var(--am);border-radius:var(--rl);padding:.7rem 1rem;margin-bottom:10px}
.rep-hdr{background:linear-gradient(135deg,var(--lbd),var(--lb));color:#fff;border-radius:var(--rl);padding:1.2rem 1.4rem;margin-bottom:14px;display:flex;align-items:center;gap:14px}
.rep-hdr h2{font-size:18px;font-weight:800}.rep-hdr .sub{font-size:11px;opacity:.8;margin-top:3px}
.rmb{margin-bottom:12px;border:1px solid var(--gyb);border-radius:var(--rl);overflow:hidden;box-shadow:var(--sh)}
.rmh{display:flex;align-items:center;gap:10px;padding:.75rem 1rem;border-bottom:1px solid var(--gyb);background:var(--gyl)}
.chip{padding:2px 6px;border-radius:4px;font-size:9px;font-weight:700;display:inline-block;margin:2px}
.yr-wrap{overflow-x:auto}
.cycle-leg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.cl-i{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--mu)}
.cl-d{width:12px;height:12px;border-radius:3px}
@media print{
  @page{margin:10mm 8mm;size:A4}
  .np,.nav{display:none !important}
  body{background:#fff}
  .card,.rmb{break-inside:avoid;border:1px solid #ccc;box-shadow:none}
  .ov{display:none !important}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

PR.forEach(p=>{ponds[p.id]={maqIds:[],tasks:{},operario:'',fechaInicio:'',fechaFin:'',mlPlanificados:0,notas:''};});
function pondStatusFor(pid,mid){const pd=ponds[pid];return(pd&&pd.tasks&&pd.tasks[mid]&&pd.tasks[mid].status)||'pendiente';}
function setPondStatusFor(pid,mid,status,notas){const pd=ponds[pid];if(!pd)return;if(!pd.tasks)pd.tasks={};pd.tasks[mid]={status,notas:notas!==undefined?notas:(pd.tasks[mid]?pd.tasks[mid].notas:'')};if(!pd.maqIds.includes(mid))pd.maqIds.push(mid);}
function pondAggStatus(pid){const pd=ponds[pid];if(!pd||!pd.maqIds.length)return'pendiente';const sts=pd.maqIds.map(mid=>pondStatusFor(pid,mid));if(sts.every(s=>s==='listo'))return'listo';if(sts.some(s=>s==='proceso'))return'proceso';if(sts.some(s=>s==='planif'))return'planif';return'pendiente';}

function slbl(s){return{listo:'Lista',proceso:'En proceso',pendiente:'Pendiente',planif:'Planificada'}[s]||s;}
function gsec(id){const p=PR.find(x=>x.id===id);if(p&&p.sector)return p.sector;const f=id.trim().split(' ')[0].toUpperCase();return SECS.includes(f)?f:'OTROS';}
function mcol(id){const i=maquinas.findIndex(x=>x.id===id);return i>=0?MCOLS[i%MCOLS.length]:'#888';}
function swatch(id){return '<span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:'+mcol(id)+';margin-right:5px;vertical-align:middle"></span>';}
function fd(d){if(!d)return'—';const p=d.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:d;}
function ymd(d){return d.toISOString().split('T')[0];}
function todayYmd(){return ymd(new Date());}
function todayLbl(){return new Date().toLocaleDateString('es-EC',{day:'2-digit',month:'long',year:'numeric'});}
function wkStart(off){const n=new Date();const dow=(n.getDay()+6)%7;const m=new Date(n);m.setDate(n.getDate()-dow+off*7);m.setHours(0,0,0,0);return m;}
function wkDays(off){const m=wkStart(off);return Array.from({length:7},(_,i)=>{const d=new Date(m);d.setDate(m.getDate()+i);return d;});}
function wkKey(off){return ymd(wkStart(off));}
function wkLbl(off){const d=wkDays(off);return d[0].toLocaleDateString('es-EC',{day:'2-digit',month:'short'})+' – '+d[6].toLocaleDateString('es-EC',{day:'2-digit',month:'short',year:'numeric'});}
function wkNum(date){const d=new Date(date||wkStart(0));d.setDate(d.getDate()+3-(d.getDay()||7));const w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/86400000-3+(w1.getDay()||7))/7);}
function listFromRaw(v){if(!v)return[];if(Array.isArray(v))return v;return(v.tipo&&v.tipo!=='libre')?[v]:[];}
function getAgList(mid,dk){return listFromRaw(agenda[mid+'_'+dk]);}
function setAgList(mid,dk,list){if(!list||!list.length){delete agenda[mid+'_'+dk];}else{agenda[mid+'_'+dk]=list;}}
function getAg(mid,dk){
  const list=getAgList(mid,dk);
  if(!list.length)return{tipo:'libre',piscinas:[],motivo:'',horas:0,mlPlan:0,mlReal:0,notas:'',list:[]};
  let horas=0,mlPlan=0,mlReal=0,hasTrabajo=false,hasParada=false,piscinas=[],motivos=[];
  list.forEach(a=>{horas+=a.horas||0;mlPlan+=a.mlPlan||0;mlReal+=a.mlReal||0;if(a.tipo==='trabajo'){hasTrabajo=true;piscinas=piscinas.concat(a.piscinas||[]);}if(a.tipo==='parada'){hasParada=true;motivos.push(a.motivo||'Sin motivo');}});
  return{tipo:hasTrabajo?'trabajo':(hasParada?'parada':'libre'),piscinas:[...new Set(piscinas)],motivo:motivos.join(', '),horas,mlPlan,mlReal,notas:list.map(a=>a.notas).filter(Boolean).join(' | '),list};
}
function galPorHora(mid){const m=maquinas.find(x=>x.id===mid);return m?(GAL_POR_HORA[m.tipo]||5):5;}
function maqStats(mid){const ps=PR.filter(p=>ponds[p.id].maqIds.includes(mid));const r={total:ps.length,listo:0,proceso:0,pendiente:0,planif:0};ps.forEach(p=>r[pondStatusFor(p.id,mid)]++);return r;}
function overall(){let r={total:PR.length,listo:0,proceso:0,pendiente:0,planif:0};PR.forEach(p=>r[pondAggStatus(p.id)]++);return r;}
function secStats(){const s={};[...SECS,...SECS_EXTRA,'OTROS'].forEach(x=>s[x]={total:0,listo:0,proceso:0,pendiente:0,planif:0});PR.forEach(p=>{const sc=gsec(p.id);if(s[sc]){s[sc].total++;s[sc][pondAggStatus(p.id)]++;}});return s;}
function totHoras(mid){let h=0,mlR=0,mlP=0;Object.keys(agenda).forEach(k=>{if(k.startsWith(mid+'_')){listFromRaw(agenda[k]).forEach(a=>{h+=a.horas||0;mlR+=a.mlReal||0;mlP+=a.mlPlan||0;});}});return{h,mlR,mlP};}
function totComb(mid){let galAg=0;Object.keys(agenda).forEach(k=>{if(k.startsWith(mid+'_')){listFromRaw(agenda[k]).forEach(a=>{galAg+=(a.horas||0)*galPorHora(mid);});}});const regs=combustible.filter(c=>c.mid===mid);const galMan=regs.reduce((a,c)=>a+(c.galones||0),0);const costoMan=regs.reduce((a,c)=>a+(c.costo||0),0);return{galAg:Math.round(galAg*100)/100,galMan,costoMan};}
function allCostos(){let galTotal=0,costoTotal=0;maquinas.forEach(m=>{const c=totComb(m.id);galTotal+=c.galMan||c.galAg;costoTotal+=c.costoMan||(c.galAg*PRECIO_GALON);});return{galTotal:Math.round(galTotal*100)/100,costoTotal:Math.round(costoTotal*100)/100};}
function comparativoData(){
  const rows=maquinas.map(m=>{
    const horas=totHoras(m.id).h;
    const chp=m.costoHoraPropia||0,cha=m.costoHoraAlquilada||0;
    const totalPropia=Math.round(horas*chp*100)/100;
    const totalAlquilada=Math.round(horas*cha*100)/100;
    const real=Math.round(horas*(m.propiedad==='propia'?chp:cha)*100)/100;
    return{m,horas,chp,cha,totalPropia,totalAlquilada,real,dif:Math.round((totalAlquilada-totalPropia)*100)/100};
  });
  const totalPropia=rows.reduce((a,r)=>a+r.totalPropia,0);
  const totalAlquilada=rows.reduce((a,r)=>a+r.totalAlquilada,0);
  const totalReal=rows.reduce((a,r)=>a+r.real,0);
  return{rows,totalPropia:Math.round(totalPropia*100)/100,totalAlquilada:Math.round(totalAlquilada*100)/100,totalReal:Math.round(totalReal*100)/100};
}
function setCostoHora(mid,campo,val){const m=maquinas.find(x=>x.id===mid);if(!m)return;m[campo]=parseFloat(val)||0;rCostos();saveAll();}
function barChartCompar(items,leftLbl,rightLbl){
  const max=Math.max(1,...items.flatMap(i=>[i.a,i.b]));
  const rh=46,pad=10,labelW=150,barMaxW=360;
  let svg='<svg viewBox="0 0 640 '+(items.length*rh+pad*2)+'" style="width:100%;height:auto;font-family:var(--fn)">';
  svg+='<rect x="'+labelW+'" y="0" width="'+barMaxW+'" height="'+(items.length*rh+pad*2)+'" fill="none"></rect>';
  items.forEach((it,i)=>{
    const y=i*rh+pad;
    const wA=Math.max(2,Math.round((it.a/max)*barMaxW));
    const wB=Math.max(2,Math.round((it.b/max)*barMaxW));
    svg+='<text x="0" y="'+(y+11)+'" font-size="10" font-weight="700" fill="#111827">'+it.label+'</text>';
    svg+='<rect x="'+labelW+'" y="'+y+'" width="'+wA+'" height="13" rx="3" fill="var(--lb)"></rect>';
    svg+='<text x="'+(labelW+wA+6)+'" y="'+(y+11)+'" font-size="9" fill="var(--lb)">$'+it.a.toFixed(2)+'</text>';
    svg+='<rect x="'+labelW+'" y="'+(y+17)+'" width="'+wB+'" height="13" rx="3" fill="var(--lo)"></rect>';
    svg+='<text x="'+(labelW+wB+6)+'" y="'+(y+27)+'" font-size="9" fill="var(--lo)">$'+it.b.toFixed(2)+'</text>';
  });
  svg+='</svg>';
  return '<div class="leg" style="margin-bottom:8px"><div class="li"><div class="ld" style="background:var(--lb)"></div>'+leftLbl+'</div><div class="li"><div class="ld" style="background:var(--lo)"></div>'+rightLbl+'</div></div>'+svg;
}
function daysUntil(dk){if(!dk)return null;const d=new Date(dk+'T12:00');const n=new Date();n.setHours(0,0,0,0);return Math.round((d-n)/864e5);}
function pctCol(p){return p>=90?'var(--gn)':p>=70?'var(--am)':'var(--rd)';}
function getMantAl(mid){const al=(mantenimiento[mid]||[]).filter(r=>{if(r.estado==='realizado')return false;const d=daysUntil(r.proxima);return d!==null&&d<=7;});return al.map(a=>{const d=daysUntil(a.proxima);const c=d<=0?'var(--rd)':'var(--am)';return'<span style="color:'+c+';font-size:9px;font-weight:700">'+a.tipo+': '+(d<=0?'VENCIDO':'en '+d+'d')+'</span>';}).join(' ');}
function getCy(yr,wk){return(weekCycles[yr]||{})[wk]||{tipo:'libre',maquina:'',notas:'',interval:0};}
function setCy(yr,wk,v){if(!weekCycles[yr])weekCycles[yr]={};weekCycles[yr][wk]=v;}
function getCyP(pid,yr,wk){return(((weekCyclesPond[pid]||{})[yr])||{})[wk]||{tipo:'libre',maquina:'',notas:'',interval:0};}
function setCyP(pid,yr,wk,v){if(!weekCyclesPond[pid])weekCyclesPond[pid]={};if(!weekCyclesPond[pid][yr])weekCyclesPond[pid][yr]={};weekCyclesPond[pid][yr][wk]=v;}
function allSecs(){return[...SECS,...SECS_EXTRA,'OTROS'];}

// NAVIGATION
const TABS=['resumen','maquinaria','piscinas','agenda','planilla','ciclos','costos','mant','operarios'];
function sw(t){
  curTab=t;
  TABS.forEach(id=>{
    document.getElementById('vw-'+id).style.display=id===t?'block':'none';
  });
  document.querySelectorAll('.nb').forEach((b,i)=>{
    b.classList.toggle('active',TABS[i]===t);
  });
  ({resumen:rResumen,maquinaria:()=>{rMaqCards();if(activeMaqId)rMaqDetail(activeMaqId);},piscinas:rAllPonds,agenda:rAgenda,planilla:rPlanilla,ciclos:rCiclos,costos:rCostos,mant:rMant,operarios:rOperarios})[t]?.();
}

// RESUMEN EJECUTIVO
function rResumen(){
  const o=overall();const pct=Math.round(o.listo/o.total*100);const ss=secStats();
  const ac=allCostos();
  const haTot=PR.reduce((a,p)=>a+(p.ha||0),0);
  const haListo=PR.filter(p=>pondAggStatus(p.id)==='listo').reduce((a,p)=>a+(p.ha||0),0);
  const maqAct=maquinas.filter(m=>maqStats(m.id).proceso>0).length;
  let mantPend=0;maquinas.forEach(m=>{(mantenimiento[m.id]||[]).forEach(r=>{if(r.estado!=='realizado'&&daysUntil(r.proxima)!==null&&daysUntil(r.proxima)<=14)mantPend++;});});
  const days=wkDays(0);let wkH=0,wkML=0;
  maquinas.forEach(m=>days.forEach(d=>{const ag=getAg(m.id,ymd(d));wkH+=ag.horas||0;wkML+=ag.mlReal||0;}));

  let h='<div class="kpi-grid">';
  const kpis=[
    {cls:'kb',val:o.total,lbl:'Total piscinas',tr:haTot.toFixed(1)+' ha totales'},
    {cls:'kg',val:o.listo,lbl:'Piscinas listas',dl:pct+'% · '+haListo.toFixed(1)+' ha',dlc:'var(--gnd)',bar:pct,barcol:'var(--gn)'},
    {cls:'ka',val:o.proceso,lbl:'En proceso',tr:o.planif+' planificadas'},
    {cls:'kr',val:o.pendiente,lbl:'Pendientes',tr:PR.filter(p=>!ponds[p.id].maqIds.length).length+' sin máquina'},
    {cls:'kb',val:maquinas.length,lbl:'Máquinas en flota',tr:maqAct+' activas · '+maquinas.filter(m=>m.propiedad==='alquilada').length+' alquiladas'},
    {cls:'ko',val:ac.galTotal.toFixed(0)+' gal',lbl:'Combustible consumido',tr:'Costo est. $'+ac.costoTotal.toFixed(2)},
    {cls:'ka',val:wkML,lbl:'ML reales esta semana',tr:wkH+'h trabajadas'},
    mantPend?{cls:'kr',val:mantPend,lbl:'Alertas mantenimiento',tr:'Vencen en ≤14 días',trc:'var(--rd)'}:{cls:'kg',val:'0',lbl:'Alertas mantenimiento',tr:'Sin alertas activas'},
  ];
  kpis.forEach(k=>{
    h+='<div class="kpi '+k.cls+'"><div class="val"'+( k.valc?` style="color:${k.valc}"`:'')+'">'+k.val+'</div><div class="lbl">'+k.lbl+'</div>';
    if(k.dl) h+='<div class="dl" style="color:'+(k.dlc||'inherit')+'">'+k.dl+'</div>';
    if(k.tr) h+='<div class="tr"'+(k.trc?` style="color:${k.trc}"`:'')+'">'+k.tr+'</div>';
    if(k.bar!==undefined) h+='<div class="pb"><div class="pf" style="width:'+Math.min(k.bar,100)+'%;background:'+k.barcol+'"></div></div>';
    h+='</div>';
  });
  h+='</div><div class="g2">';

  // Sector avance
  h+='<div><div class="card"><div class="ct">Avance por sector</div>';
  SECS.forEach(sc=>{
    const d=ss[sc];if(!d||!d.total)return;const p2=Math.round(d.listo/d.total*100);
    h+='<div style="margin-bottom:9px"><div class="fl jb" style="margin-bottom:3px"><span style="font-size:12px;font-weight:700">Sector '+sc+'</span><span style="font-size:10px;color:var(--mu)">'+d.listo+'/'+d.total+' · '+p2+'%</span></div>';
    h+='<div class="sbar"><div style="width:'+Math.round(d.listo/d.total*100)+'%;background:var(--gn)"></div><div style="width:'+Math.round(d.proceso/d.total*100)+'%;background:var(--am)"></div><div style="width:'+Math.round(d.planif/d.total*100)+'%;background:var(--lb)"></div><div style="width:'+Math.round(d.pendiente/d.total*100)+'%;background:var(--rd)"></div></div></div>';
  });
  h+='<div class="leg" style="margin-top:8px"><div class="li"><div class="ld" style="background:var(--gn)"></div>Lista</div><div class="li"><div class="ld" style="background:var(--am)"></div>En proceso</div><div class="li"><div class="ld" style="background:var(--lb)"></div>Planificada</div><div class="li"><div class="ld" style="background:var(--rd)"></div>Pendiente</div></div></div></div>';

  // Estado maquinaria
  h+='<div><div class="card"><div class="ct">Estado de maquinaria</div>';
  maquinas.forEach(m=>{
    const s=maqStats(m.id);const col=mcol(m.id);const p2=s.total?Math.round(s.listo/s.total*100):0;
    const al=getMantAl(m.id);const c=totComb(m.id);
    h+='<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--gyb)">';
    h+='<div style="width:3px;height:36px;border-radius:2px;background:'+col+';flex-shrink:0"></div>';
    h+='<div style="width:14px;height:14px;border-radius:3px;background:'+col+';flex-shrink:0"></div>';
    h+='<div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:700;color:'+col+'">'+m.nombre+'</div>';
    h+='<div style="font-size:10px;color:var(--mu)">'+(m.operario||'Sin operario')+' · '+s.total+' piscinas · '+p2+'%</div>';
    if(al) h+='<div style="font-size:9px;margin-top:1px">'+al+'</div>';
    h+='<div class="pb" style="margin-top:3px;height:4px"><div class="pf" style="width:'+p2+'%;background:'+col+'"></div></div></div>';
    h+='<div style="text-align:right;font-size:9px;color:var(--mu)"><div>'+(c.galMan||c.galAg).toFixed(1)+' gal</div><span class="bdg '+(m.propiedad==='propia'?'bgpr':'bgal')+'">'+m.propiedad+'</span></div></div>';
  });
  if(!maquinas.length) h+='<div class="empty">Sin máquinas. Vaya a Maquinaria.</div>';
  h+='</div></div></div>';

  // Semana actual mini-grid
  h+='<div class="card" style="margin-top:2px"><div class="fl jb ac" style="margin-bottom:10px"><div class="ct" style="margin:0">Semana actual — '+wkLbl(0)+'</div><button class="btn btnp" onclick="sw(\'agenda\')" style="font-size:10px">Ver agenda </button></div>';
  h+='<div style="overflow-x:auto"><div style="display:grid;grid-template-columns:110px repeat(7,1fr);gap:4px;min-width:600px">';
  h+='<div></div>';
  wkDays(0).forEach(d=>{const dn=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];h+='<div style="text-align:center;font-size:10px;font-weight:700;color:var(--mu);padding:3px">'+dn[d.getDay()===0?6:d.getDay()-1]+'<br>'+d.getDate()+'/'+(d.getMonth()+1)+'</div>';});
  maquinas.forEach(m=>{
    const col=mcol(m.id);
    h+='<div style="display:flex;align-items:center;gap:4px;font-size:10px;font-weight:700;color:'+col+';padding:2px 0">'+swatch(m.id)+m.nombre.split(' ')[0]+'</div>';
    wkDays(0).forEach(d=>{
      const ag=getAg(m.id,ymd(d));const isT=ymd(d)===todayYmd();
      const bg=ag.tipo==='trabajo'?'background:var(--gnl);color:var(--gnd)':ag.tipo==='parada'?'background:var(--aml);color:var(--amd)':'background:var(--gyl);color:var(--mu)';
      const lbl=ag.tipo==='trabajo'?'':ag.tipo==='parada'?'':'—';
      h+='<div style="text-align:center;padding:5px 2px;border-radius:6px;font-size:9px;font-weight:600;'+bg+';'+(isT?'outline:2px solid var(--lo);':'')+'cursor:pointer" onclick="sw(\'agenda\')" title="'+ag.tipo+'">'+lbl+(ag.mlPlan?'<br>'+ag.mlPlan+'ml':'')+'</div>';
    });
  });
  h+='</div></div></div>';
  document.getElementById('vw-resumen').innerHTML=h;
}

// MAQUINARIA
function rMaqCards(){
  let h='<div class="fl jb ac" style="margin-bottom:9px"><div class="stl" style="margin:0">Flota de maquinaria</div><button class="btn btnp" onclick="openMaqModal()">+ Nueva máquina</button></div><div class="maq-grid">';
  maquinas.forEach(m=>{
    const s=maqStats(m.id);const col=mcol(m.id);const p2=s.total?Math.round(s.listo/s.total*100):0;const gph=galPorHora(m.id);
    h+='<div class="mc'+(activeMaqId===m.id?' sel':'')+'" onclick="selMaq('+m.id+')">';
    h+='<div class="fl jb"><div style="width:24px;height:24px;border-radius:5px;background:'+mcol(m.id)+'"></div><div><button class="btn" style="padding:2px 5px;font-size:10px" onclick="event.stopPropagation();openMaqModal('+m.id+')">Editar</button> <button class="btn btnd" style="padding:2px 5px;font-size:10px" onclick="event.stopPropagation();delMaq('+m.id+')">Eliminar</button></div></div>';
    h+='<div style="font-size:12px;font-weight:800;color:'+col+';margin-top:5px">'+m.nombre+'</div>';
    h+='<div style="font-size:10px;color:var(--mu)">'+m.tipo+'</div>';
    h+='<div style="margin-top:4px"><span class="bdg '+(m.propiedad==='propia'?'bgpr':'bgal')+'">'+m.propiedad+'</span></div>';
    if(m.operario) h+='<div style="font-size:9px;color:var(--mu);margin-top:2px">'+m.operario+'</div>';
    h+='<div style="font-size:9px;color:var(--mu);margin-top:2px">'+gph+' gal/h</div>';

    h+='<div class="pb" style="margin-top:4px"><div class="pf" style="width:'+p2+'%;background:'+col+'"></div></div></div>';
  });
  h+='</div><div id="maq-det" style="margin-top:13px"></div>';
  document.getElementById('vw-maquinaria').innerHTML=h;
  if(activeMaqId)rMaqDetail(activeMaqId);
}
function selMaq(id){activeMaqId=id;rMaqCards();}
function rMaqDetail(mid){
  const m=maquinas.find(x=>x.id===mid);if(!m){document.getElementById('maq-det').innerHTML='';return;}
  const col=mcol(mid);const myP=PR.filter(p=>ponds[p.id].maqIds.includes(mid));
  const s=maqStats(mid);const pct=s.total?Math.round(s.listo/s.total*100):0;
  const ha=myP.reduce((a,p)=>a+(p.ha||0),0);const th=totHoras(mid);const c=totComb(mid);
  const unassigned=PR.filter(p=>!ponds[p.id].maqIds.includes(mid));
  const bySec={};allSecs().forEach(sc=>bySec[sc]=[]);
  myP.forEach(p=>{const sc=gsec(p.id);if(!bySec[sc])bySec[sc]=[];bySec[sc].push(p);});
  let sh='';
  allSecs().forEach(sc=>{
    if(!bySec[sc]||!bySec[sc].length)return;
    sh+='<div class="stl">'+(SECS.includes(sc)?'Sector ':'')+sc+'</div><div class="pg">';
    bySec[sc].forEach(p=>{
      const pd=ponds[p.id];const cls=pondStatusFor(p.id,mid);
      const dc={listo:'dl2',proceso:'dp',pendiente:'dn',planif:'dpl'}[cls]||'dn';
      const bc={listo:'bgl',proceso:'bgp',pendiente:'bgn',planif:'bgpl'}[cls]||'bgn';
      sh+='<div class="pc '+cls+'" onclick="openPondModal(\''+p.id+'\')"><div class="pdot '+dc+'"></div><div class="pid" style="font-size:'+(p.id.length>5?'9px':'10px')+'">'+p.id+'</div><div class="pha">'+(p.ha?p.ha+'ha':'—')+'</div>'+(pd.mlPlanificados?'<div style="font-size:8px;color:var(--mu)">'+pd.mlPlanificados+'</div>':'')+'<span class="bdg '+bc+'" style="font-size:7px;padding:1px 3px">'+slbl(cls)+'</span></div>';
    });sh+='</div>';

function quickAssign(pid,mid){if(pondStatusFor(pid,mid)==='pendiente')setPondStatusFor(pid,mid,'planif');else setPondStatusFor(pid,mid,pondStatusFor(pid,mid));rMaqDetail(mid);rMaqCards();refresh();}
function delMaq(id){if(!confirm('¿Eliminar esta máquina?'))return;PR.forEach(p=>{ponds[p.id].maqIds=ponds[p.id].maqIds.filter(x=>x!==id);if(ponds[p.id].tasks)delete ponds[p.id].tasks[id];});maquinas=maquinas.filter(x=>x.id!==id);if(activeMaqId===id)activeMaqId=null;rMaqCards();saveAll();}
function generarAgendaDesdeMaquina(mid){
  const m=maquinas.find(x=>x.id===mid);if(!m)return;
  if(!m.fi||!m.ff){alert('Defina primero la fecha de inicio y la fecha fin estimada de esta máquina (botón Editar) para poder generar la agenda.');return;}
  const start=new Date(m.fi+'T12:00:00');const end=new Date(m.ff+'T12:00:00');
  if(end<start){alert('La fecha fin debe ser posterior a la fecha de inicio.');return;}
  const myPonds=PR.filter(p=>ponds[p.id].maqIds.includes(mid)).map(p=>p.id);
  if(!confirm('Se generarán jornadas de trabajo entre '+fd(m.fi)+' y '+fd(m.ff)+' para '+m.nombre+' (se respetan los días que ya tengan datos registrados). ¿Continuar?'))return;
  let count=0;
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
    if(d.getDay()===0)continue;
    const dk=ymd(d);
    if(getAgList(mid,dk).length)continue;
    setAgList(mid,dk,[{tipo:'trabajo',actividad:'Trabajo planificado',piscinas:myPonds,motivo:'',horas:8,mlPlan:m.metaDiaria||0,mlReal:0,notas:'Generado desde plan de máquina'}]);
    count++;
  }
  saveAll();
  alert(count+' día(s) generado(s) en la Agenda.'+(count===0?' Los demás días del rango ya tenían datos registrados.':''));
  if(curTab==='agenda')rAgenda();
  if(curTab==='planilla')rPlanilla();
  if(curTab==='resumen')rResumen();
}

  h+='<td style="padding:7px;text-align:center;border:1px solid rgba(255,255,255,.2)"><div>'+gtP+' ml plan.</div><div style="color:#90EE90">'+gtR+' ml real</div>'+(gC!==null?'<div style="font-size:10px">'+gC+'% cumpl.</div>':'')+'<div style="font-size:9px;opacity:.8">'+gtH+'h · '+gtPar+' paradas</div></td></tr>';

// CICLOS ANUALES
function rCiclos(){
  let h='<div class="fl jb ac" style="margin-bottom:10px;flex-wrap:wrap;gap:8px">';
  h+='<div class="fl ac g8"><button class="btn" onclick="cicloYear--;rCiclos()">'+(cicloYear-1)+'</button><span style="font-size:14px;font-weight:700">Año '+cicloYear+' — 52 semanas</span><button class="btn" onclick="cicloYear++;rCiclos()">'+(cicloYear+1)+' </button></div>';
  h+='<div class="fb" style="margin:0"><button class="fbt'+(cicloView==='maquina'?' active':'')+'" onclick="setCicloView(\'maquina\')">Por máquina</button><button class="fbt'+(cicloView==='piscina'?' active':'')+'" onclick="setCicloView(\'piscina\')">Por piscina</button></div>';
  if(cicloView==='maquina') h+='<button class="btn btnp" onclick="openCicloModal()">+ Registrar actividad</button>';
  h+='</div>';
  h+='<div class="cycle-leg">';
  Object.entries(CYCLE_COLORS).filter(([k])=>k!=='libre').forEach(([k,c])=>{h+='<div class="cl-i"><div class="cl-d" style="background:'+c+'"></div>'+CYCLE_LABELS[k]+'</div>';});
  h+='</div>';
  h+= cicloView==='maquina' ? rCiclosMaquina() : rCiclosPiscina();
  document.getElementById('vw-ciclos').innerHTML=h;
}
function setCicloView(v){cicloView=v;rCiclos();}
function weekDatesOf(yr){const arr=[];for(let w=1;w<=52;w++){const d=new Date(yr,0,1+(w-1)*7);const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);arr.push({w,d,key:ymd(d)});}return arr;}
function monthHeader(weekDates){const monthStarts={};weekDates.forEach(({w,d})=>{const mn=d.getMonth();if(monthStarts[mn]===undefined)monthStarts[mn]={w,label:d.toLocaleDateString('es-EC',{month:'short'})};});let h='<div class="yr-wrap"><div style="display:grid;grid-template-columns:140px 1fr;gap:0;margin-bottom:3px"><div></div><div style="position:relative;height:16px">';for(let mn=0;mn<12;mn++){const ms=monthStarts[mn];if(!ms)continue;const lp=((ms.w-1)/52)*100;h+='<div style="position:absolute;left:'+lp+'%;font-size:9px;color:var(--mu);font-weight:700;text-transform:uppercase">'+ms.label+'</div>';}h+='</div></div>';return h;}

function rCiclosMaquina(){
  let h='<div style="background:var(--lbl);border:1px solid var(--lbm);border-radius:var(--r);padding:.5rem .9rem;margin-bottom:10px;font-size:11px;color:var(--lbd)">Registre cuándo se hizo cada actividad y planiﬁque cuándo se repite, por máquina. Haga clic en cualquier semana para editar. Use <strong>Repetición</strong> para planificar automáticamente cada N semanas.</div>';
  if(!maquinas.length) return h+'<div class="empty">Sin máquinas registradas.</div>';
  const weekDates=weekDatesOf(cicloYear);
  h+=monthHeader(weekDates);
  maquinas.forEach(m=>{
    const col=mcol(m.id);
    h+='<div style="display:grid;grid-template-columns:140px 1fr;gap:4px;margin-bottom:5px;align-items:center">';
    h+='<div style="font-size:11px;font-weight:700;color:'+col+';display:flex;align-items:center;gap:5px">'+swatch(m.id)+m.nombre+'</div>';
    h+='<div style="display:flex;gap:1px">';
    weekDates.forEach(({w,d,key})=>{
      const cy=getCy(cicloYear,w);
      const isThisWk=ymd(d)===wkKey(0)&&d.getFullYear()===cicloYear;
      const bgc=CYCLE_COLORS[cy.tipo]||'#e5e7eb';
      const hasMaq=!cy.maquina||cy.maquina==m.id;
      const op=hasMaq?1:0.3;
      h+='<div title="Sem '+w+' · '+fd(key)+'\n'+(CYCLE_LABELS[cy.tipo]||'Libre')+(cy.notas?'\n'+cy.notas:'')+'" onclick="openCicloModal('+cicloYear+','+w+','+m.id+')" style="flex:1;height:22px;background:'+bgc+';border-radius:2px;cursor:pointer;opacity:'+op+';border:'+(isThisWk?'2px solid var(--lo)':'1px solid transparent')+';transition:transform .1s" onmouseover="this.style.transform=\'scaleY(1.3)\'" onmouseout="this.style.transform=\'scaleY(1)\'"></div>';
    });
    h+='</div></div>';
  });
  h+='</div>';
  h+='<div style="margin-top:14px"><div class="stl">Próximas actividades (90 días)</div>';
  const upcoming=[];
  for(let yr=cicloYear;yr<=cicloYear+1;yr++){
    for(let w=1;w<=52;w++){
      const cy=getCy(yr,w);if(cy.tipo==='libre')continue;
      const d=new Date(yr,0,1+(w-1)*7);const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);
      const dL=Math.round((d-new Date())/864e5);
      if(dL>=-7&&dL<=90)upcoming.push({yr,w,cy,d,dL,key:ymd(d)});
    }
  }
  if(upcoming.length){
    h+='<div class="tov"><table><thead><tr><th>Sem.</th><th>Fecha</th><th>Actividad</th><th>Máquina</th><th>Notas</th><th>Estado</th></tr></thead><tbody>';
    upcoming.forEach(({yr,w,cy,d,dL,key})=>{
      const maq=cy.maquina?maquinas.find(x=>x.id==cy.maquina):null;
      const col2=CYCLE_COLORS[cy.tipo]||'#888';
      const bdg=dL<0?'<span class="bdg bgn">Pasada</span>':dL===0?'<span class="bdg bgl">Esta semana</span>':dL<=7?'<span class="bdg bgp">En '+dL+'d</span>':'<span class="bdg bgpl">En '+Math.round(dL/7)+'sem</span>';
      h+='<tr><td style="font-weight:700">Sem '+w+'/'+yr+'</td><td>'+fd(key)+'</td><td><span style="display:inline-block;width:10px;height:10px;background:'+col2+';border-radius:2px;margin-right:4px;vertical-align:middle"></span>'+CYCLE_LABELS[cy.tipo]+'</td><td>'+(maq?swatch(maq.id)+maq.nombre:'Todas')+'</td><td style="font-size:10px">'+(cy.notas||'—')+'</td><td>'+bdg+'</td></tr>';
    });
    h+='</tbody></table></div>';
  } else h+='<div class="empty">Sin actividades en los próximos 90 días.</div>';
  h+='</div>';
  return h;
}

function setCicloPondSec(v){cicloPondSec=v;rCiclos();}
function setCicloPondQ(v){cicloPondQ=v;rCiclos();}
function rCiclosPiscina(){
  let h='<div style="background:var(--lbl);border:1px solid var(--lbm);border-radius:var(--r);padding:.5rem .9rem;margin-bottom:10px;font-size:11px;color:var(--lbd)">Registre el ciclo de cada piscina o lugar (siembra, cosecha, limpieza de bordes/fondo, mantenimiento). Haga clic en cualquier semana para editar. Use los filtros para ubicar una piscina rápidamente.</div>';
  const secOpts=['all',...allSecs()].map(s=>'<option value="'+s+'"'+(cicloPondSec===s?' selected':'')+'>'+(s==='all'?'Todos los sectores':(SECS.includes(s)?'Sector '+s:s))+'</option>').join('');
  h+='<div class="fl ac g8" style="margin-bottom:10px;flex-wrap:wrap">';
  h+='<select style="width:auto;padding:6px 8px;border:1.5px solid var(--gyb);border-radius:6px;font-size:11px" onchange="setCicloPondSec(this.value)">'+secOpts+'</select>';
  h+='<input placeholder="Buscar piscina (ej: L 05)" value="'+cicloPondQ+'" onchange="setCicloPondQ(this.value)" style="width:180px;padding:6px 8px;border:1.5px solid var(--gyb);border-radius:6px;font-size:11px">';
  h+='</div>';
  const list=PR.filter(p=>(cicloPondSec==='all'||gsec(p.id)===cicloPondSec)&&(!cicloPondQ||p.id.toLowerCase().includes(cicloPondQ.toLowerCase())));
  if(!list.length) return h+'<div class="empty">Sin piscinas para el filtro seleccionado.</div>';
  const weekDates=weekDatesOf(cicloYear);
  h+=monthHeader(weekDates);
  list.forEach(p=>{
    h+='<div style="display:grid;grid-template-columns:140px 1fr;gap:4px;margin-bottom:5px;align-items:center">';
    h+='<div style="font-size:11px;font-weight:700;color:var(--tx)">'+p.id+(p.ha?' <span style="font-weight:400;color:var(--mu)">('+p.ha+'ha)</span>':'')+'</div>';
    h+='<div style="display:flex;gap:1px">';
    weekDates.forEach(({w,d,key})=>{
      const cy=getCyP(p.id,cicloYear,w);
      const isThisWk=ymd(d)===wkKey(0)&&d.getFullYear()===cicloYear;
      const bgc=CYCLE_COLORS[cy.tipo]||'#e5e7eb';
      h+='<div title="'+p.id+' · Sem '+w+' · '+fd(key)+'\n'+(CYCLE_LABELS[cy.tipo]||'Libre')+(cy.notas?'\n'+cy.notas:'')+'" onclick="openCicloPondModal('+cicloYear+','+w+',\''+p.id+'\')" style="flex:1;height:22px;background:'+bgc+';border-radius:2px;cursor:pointer;border:'+(isThisWk?'2px solid var(--lo)':'1px solid transparent')+';transition:transform .1s" onmouseover="this.style.transform=\'scaleY(1.3)\'" onmouseout="this.style.transform=\'scaleY(1)\'"></div>';
    });
    h+='</div></div>';
  });
  h+='</div>';
  h+='<div style="margin-top:14px"><div class="stl">Próximas actividades por piscina (90 días)</div>';
  const upcoming=[];
  for(let yr=cicloYear;yr<=cicloYear+1;yr++){
    list.forEach(p=>{
      for(let w=1;w<=52;w++){
        const cy=getCyP(p.id,yr,w);if(cy.tipo==='libre')continue;
        const d=new Date(yr,0,1+(w-1)*7);const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);
        const dL=Math.round((d-new Date())/864e5);
        if(dL>=-7&&dL<=90)upcoming.push({pid:p.id,yr,w,cy,d,dL,key:ymd(d)});
      }
    });
  }
  upcoming.sort((a,b)=>a.dL-b.dL);
  if(upcoming.length){
    h+='<div class="tov"><table><thead><tr><th>Piscina</th><th>Sem.</th><th>Fecha</th><th>Actividad</th><th>Máquina sugerida</th><th>Notas</th><th>Estado</th></tr></thead><tbody>';
    upcoming.forEach(({pid,yr,w,cy,d,dL,key})=>{
      const maq=cy.maquina?maquinas.find(x=>x.id==cy.maquina):null;
      const col2=CYCLE_COLORS[cy.tipo]||'#888';
      const bdg=dL<0?'<span class="bdg bgn">Pasada</span>':dL===0?'<span class="bdg bgl">Esta semana</span>':dL<=7?'<span class="bdg bgp">En '+dL+'d</span>':'<span class="bdg bgpl">En '+Math.round(dL/7)+'sem</span>';
      h+='<tr><td style="font-weight:700">'+pid+'</td><td>Sem '+w+'/'+yr+'</td><td>'+fd(key)+'</td><td><span style="display:inline-block;width:10px;height:10px;background:'+col2+';border-radius:2px;margin-right:4px;vertical-align:middle"></span>'+CYCLE_LABELS[cy.tipo]+'</td><td>'+(maq?swatch(maq.id)+maq.nombre:'—')+'</td><td style="font-size:10px">'+(cy.notas||'—')+'</td><td>'+bdg+'</td></tr>';
    });
    h+='</tbody></table></div>';
  } else h+='<div class="empty">Sin actividades en los próximos 90 días para este filtro.</div>';
  h+='</div>';
  return h;
}

  h+='<div style="font-size:11px;color:var(--mu);margin-bottom:10px">Ingrese el costo por hora estimado si la máquina fuera propia y si fuera alquilada. El comparativo se calcula con las horas registradas en la agenda.</div>';

  cd.rows.forEach(r=>{
    const col=mcol(r.m.id);

// MANTENIMIENTO
function rMant(){
  const alertas=[];
  maquinas.forEach(m=>{(mantenimiento[m.id]||[]).forEach(r=>{if(r.estado==='realizado')return;const d=daysUntil(r.proxima);if(d!==null&&d<=14)alertas.push({m,r,d});});});
  const vencidos=alertas.filter(a=>a.d<=0).length;
  const costoMantTotal=maquinas.reduce((a,m)=>a+(mantenimiento[m.id]||[]).reduce((b,r)=>b+(r.costo||0),0),0);
  const totalRegs=maquinas.reduce((a,m)=>a+(mantenimiento[m.id]||[]).length,0);
  let h='<div class="cost-kpi">';
  [[totalRegs,'Registros de mantenimiento'],[alertas.length,'Próximos o vencidos (≤14 días)'],[vencidos,'Vencidos'],['$'+costoMantTotal.toFixed(2),'Costo acumulado de mantenimiento']].forEach(([v,l])=>{h+='<div class="ck"><div class="cv">'+v+'</div><div class="cl">'+l+'</div></div>';});
  h+='</div>';
  h+='<div class="fl jb ac" style="margin-bottom:9px"><div class="stl" style="margin:0">Mantenimiento de maquinaria</div><button class="btn btnp" onclick="openMantModal()">+ Nuevo registro</button></div>';
  if(alertas.length){
    h+='<div class="mant-al"><div style="font-size:11px;font-weight:700;color:var(--amd);margin-bottom:5px">Mantenimientos próximos o vencidos</div>';
    alertas.forEach(({m,r,d})=>{h+='<div style="font-size:11px;color:'+(d<=0?'var(--rd)':'var(--amd)')+';margin-bottom:2px"><strong>'+swatch(m.id)+m.nombre+'</strong> — '+r.tipo+': '+(d<=0?'<strong>VENCIDO ('+Math.abs(d)+'d)</strong>':'en <strong>'+d+' días</strong> · '+fd(r.proxima))+'</div>';});
    h+='</div>';
  }
  maquinas.forEach(m=>{
    const col=mcol(m.id);const regs=mantenimiento[m.id]||[];
    h+='<div class="card" style="border-left:4px solid '+col+'"><div class="fl jb ac" style="margin-bottom:8px"><div style="font-size:12px;font-weight:800;color:'+col+'">'+swatch(m.id)+m.nombre+' <span style="font-size:10px;font-weight:400;color:var(--mu)">· '+galPorHora(m.id)+' gal/h</span></div><button class="btn" onclick="openMantModal('+m.id+')">+ Agregar</button></div>';
    if(!regs.length){h+='<div style="font-size:11px;color:var(--mu)">Sin registros.</div>';}
    else{
      h+='<div class="tov"><table><thead><tr><th>Servicio</th><th>Realizado</th><th>Próximo</th><th>Estado</th><th>Costo</th><th>Notas</th><th></th></tr></thead><tbody>';
      regs.sort((a,b)=>a.proxima<b.proxima?-1:1).forEach((r,i)=>{
        const d=daysUntil(r.proxima);
        const est=r.estado==='realizado'?'<span class="bdg bgl">Listo</span>':d!==null&&d<=0?'<span class="bdg bgn">Vencido</span>':d!==null&&d<=7?'<span class="bdg bgp">'+d+'d</span>':'<span class="bdg bgpl">'+(d!==null?d+'d':'—')+'</span>';
        h+='<tr><td style="font-weight:700">'+r.tipo+'</td><td>'+fd(r.fechaRealizado)+'</td><td style="font-weight:700">'+fd(r.proxima)+'</td><td>'+est+'</td><td>'+(r.costo?'$'+r.costo:'—')+'</td><td style="font-size:10px">'+(r.notas||'')+'</td><td style="white-space:nowrap">'+(r.estado!=='realizado'?'<button class="btn" style="font-size:9px;padding:2px 5px;margin-right:3px;background:var(--gnl);border-color:var(--gnm);color:var(--gnd)" onclick="markDone('+m.id+','+i+')">Completar</button>':'')+'<button class="btn btnd" style="font-size:9px;padding:2px 5px" onclick="delMant('+m.id+','+i+')">Eliminar</button></td></tr>';
      });h+='</tbody></table></div>';
    }h+='</div>';
  });
  document.getElementById('vw-mant').innerHTML=h||'<div class="empty">Sin máquinas.</div>';
}
function markDone(mid,i){mantenimiento[mid][i].estado='realizado';rMant();saveAll();}
function delMant(mid,i){if(!confirm('¿Eliminar?'))return;mantenimiento[mid].splice(i,1);rMant();saveAll();}

// OPERARIOS / NOMINA
function rOperarios(){
  const propios=operarios.filter(o=>o.tipo==='lukmar');
  const alquilados=operarios.filter(o=>o.tipo==='alquilada');
  const nominaPropios=propios.reduce((a,o)=>a+(o.costoMensual||0),0);
  const costoAlquiladosEst=alquilados.reduce((a,o)=>{const h=o.maquinaId?totHoras(o.maquinaId).h:0;return a+h*(o.costoHora||0);},0);
  let h='<div class="fl jb ac" style="margin-bottom:10px"><div class="stl" style="margin:0">Nómina de operarios</div><button class="btn btnp" onclick="openOpModal()">+ Nuevo operario</button></div>';
  h+='<div style="font-size:11px;color:var(--mu);margin-bottom:10px">Personal Lukmar: se registra por salario mensual. Personal de máquinas alquiladas: se registra por costo/hora y el sistema calcula lo que se les debe según las horas ya registradas en Agenda para su máquina.</div>';
  h+='<div class="cost-kpi">';
  [[operarios.length,'Total de operarios'],[propios.length,'Personal Lukmar'],[alquilados.length,'De máquinas alquiladas'],['$'+nominaPropios.toFixed(2),'Nómina mensual — personal propio'],['$'+costoAlquiladosEst.toFixed(2),'Costo estimado — externos por hora'],['$'+(nominaPropios+costoAlquiladosEst).toFixed(2),'Total nómina estimada']].forEach(([v,l])=>{h+='<div class="ck"><div class="cv">'+v+'</div><div class="cl">'+l+'</div></div>';});
  h+='</div>';
  h+='<div class="card"><div class="tov"><table><thead><tr><th>Operario</th><th>Tipo</th><th>Máquina asignada</th><th>Salario mensual</th><th>Costo/hora</th><th>Horas reg.</th><th>Costo estimado</th><th></th></tr></thead><tbody>';
  if(!operarios.length) h+='<tr><td colspan="8" style="text-align:center;padding:1.5rem;color:var(--mu)">Sin operarios registrados.</td></tr>';
  operarios.forEach(o=>{
    const maq=maquinas.find(x=>x.id===o.maquinaId);
    const esPropio=o.tipo==='lukmar';
    const horasReg=(!esPropio&&o.maquinaId)?totHoras(o.maquinaId).h:0;
    const costoEst=esPropio?(o.costoMensual||0):horasReg*(o.costoHora||0);
    h+='<tr><td style="font-weight:700">'+o.nombre+'</td><td><span class="bdg '+(esPropio?'bgpr':'bgal')+'">'+(esPropio?'Personal Lukmar':'Máquina alquilada')+'</span></td><td>'+(maq?swatch(maq.id)+maq.nombre:'—')+'</td><td style="text-align:center">'+(esPropio?'$'+(o.costoMensual||0).toFixed(2):'—')+'</td><td style="text-align:center">'+(esPropio?'—':'$'+(o.costoHora||0).toFixed(2))+'</td><td style="text-align:center">'+(esPropio?'—':horasReg+'h')+'</td><td style="text-align:center;font-weight:700;color:var(--lod)">$'+costoEst.toFixed(2)+'</td><td style="white-space:nowrap"><button class="btn" style="padding:2px 6px;font-size:9px" onclick="openOpModal('+o.id+')">Editar</button> <button class="btn btnd" style="padding:2px 6px;font-size:9px" onclick="delOp('+o.id+')">Eliminar</button></td></tr>';
  });
  h+='<tr style="font-weight:800;border-top:2px solid var(--lb);background:var(--lbl)"><td colspan="3">TOTAL</td><td style="text-align:center">$'+nominaPropios.toFixed(2)+'</td><td colspan="2"></td><td style="text-align:center">$'+(nominaPropios+costoAlquiladosEst).toFixed(2)+'</td><td></td></tr>';
  h+='</tbody></table></div></div>';
  document.getElementById('vw-operarios').innerHTML=h;
}

function autoProjectCiclo(piscinas,tipo,interval,mid,notas,dk){
  if(!tipo||!piscinas.length)return;
  const d=new Date(dk+'T12:00:00');const yr=d.getFullYear();const wk=wkNum(d);
  piscinas.forEach(pid=>{
    setCyP(pid,yr,wk,{tipo,maquina:mid,notas,interval:interval||0});
    if(interval>0){
      for(let sw=wk+interval;sw<=52;sw+=interval)setCyP(pid,yr,sw,{tipo,maquina:mid,notas,interval});
      const first2=(interval-(52-wk)%interval)%interval||interval;
      for(let sw2=first2;sw2<=52;sw2+=interval)setCyP(pid,yr+1,sw2,{tipo,maquina:mid,notas,interval});
    }
  });
}

function shareWeek(){
  const days=wkDays(agWkOff);const DN=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const wn=wkNum(wkStart(agWkOff));
  let txt='PLANIFICACIÓN SEMANAL — SEMANA '+wn+'\nCamaronera Lukmar · Grupo Lukmar S.A.\n'+wkLbl(agWkOff)+'\n'+'-'.repeat(34)+'\n\n';
  maquinas.forEach(m=>{
    const hasWork=days.some(d=>getAgList(m.id,ymd(d)).length);if(!hasWork)return;
    let wML=0,wH=0;days.forEach(d=>{const ag=getAg(m.id,ymd(d));wML+=ag.mlPlan||0;wH+=ag.horas||0;});
    txt+=m.nombre+(m.operario?' — '+m.operario:'')+'\n';
    days.forEach((d,i)=>{
      const list=getAgList(m.id,ymd(d));if(!list.length)return;
      list.forEach(a=>{
        if(a.tipo==='parada'){txt+='   '+DN[i]+': PARADA — '+(a.motivo||'sin motivo')+'\n';return;}
        const locs=(a.piscinas||[]).slice(0,5).join(', ')+((a.piscinas||[]).length>5?' +más':'');
        txt+='   '+DN[i]+': '+(a.actividad||'Trabajo')+(locs?' ('+locs+')':'')+(a.mlPlan?' | '+a.mlPlan+'ml':'')+(a.horas?' | '+a.horas+'h':'')+'\n';
      });
    });
    txt+='   Semana: '+wML+'ml · '+wH+'h\n\n';

function colLetter(n){let s='';while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;}
async function exportPlanillaExcel(){
  if(typeof ExcelJS==='undefined'){alert('No se pudo cargar el generador de Excel. Verifique su conexión a internet e intente de nuevo.');return;}
  const days=wkDays(planWkOff);const DN=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet('Reporte Semanal');
  const lastCol=colLetter(3+days.length+4);
  ws.mergeCells('A1:'+lastCol+'1');
  ws.getCell('A1').value='PLANIFICACIÓN DE MAQUINARIA — CAMARONERA LUKMAR';
  ws.getCell('A1').font={bold:true,size:13,color:{argb:'FFFFFFFF'}};
  ws.getCell('A1').alignment={vertical:'middle',horizontal:'left',indent:1};
  ws.getCell('A1').fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1A3D70'}};
  ws.getRow(1).height=24;
  ws.mergeCells('A2:'+lastCol+'2');
  ws.getCell('A2').value='Semana '+wkNum(wkStart(planWkOff))+' · '+wkLbl(planWkOff)+' · Grupo Lukmar S.A.';
  ws.getCell('A2').font={italic:true,size:10,color:{argb:'FF555555'}};
  ws.getRow(3).height=4;
  const headerRow=['Máquina','Operario','Piscinas asignadas',...DN.map((d,i)=>d+' '+days[i].getDate()+'/'+(days[i].getMonth()+1)),'ML Plan','ML Real','% Cumpl.','Horas'];
  const hr=ws.addRow(headerRow);
  hr.eachCell(c=>{c.font={bold:true,color:{argb:'FFFFFFFF'},size:10};c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1A3D70'}};c.alignment={horizontal:'center',vertical:'middle',wrapText:true};});
  hr.height=30;
  maquinas.forEach(m=>{
    const myP=PR.filter(p=>ponds[p.id].maqIds.includes(m.id));
    let wp=0,wr=0,wh=0,maxLines=1;
    const dayCells=[];
    days.forEach(d=>{
      const list=getAgList(m.id,ymd(d));
      wp+=list.reduce((a,x)=>a+(x.mlPlan||0),0);
      wr+=list.reduce((a,x)=>a+(x.mlReal||0),0);
      wh+=list.reduce((a,x)=>a+(x.horas||0),0);
      if(!list.length){dayCells.push('');}
      else{
        maxLines=Math.max(maxLines,list.length);
        const rich=[];
        list.forEach((a,i)=>{
          if(i>0)rich.push({text:'\n'});
          if(a.tipo==='parada'){rich.push({font:{bold:true,color:{argb:'FFB45309'},size:9},text:'PARADA — '+(a.motivo||'Sin motivo')});}
          else{
            rich.push({font:{bold:true,color:{argb:'FF166534'},size:9},text:(a.actividad||'Trabajo')});
            let extra='';
            if(a.piscinas&&a.piscinas.length)extra+=' ('+a.piscinas.join(', ')+')';
            if(a.mlPlan)extra+=' '+(a.mlReal||0)+'/'+a.mlPlan+'ml';
            if(a.horas)extra+=' '+a.horas+'h';
            if(extra)rich.push({font:{size:9},text:extra});
          }
        });
        dayCells.push({richText:rich});
      }
    });
    const cumpl=wp>0?Math.round(wr/wp*100):null;
    const row=ws.addRow([m.nombre,m.operario||'',myP.map(p=>p.id).join(', '),...dayCells,wp,wr,cumpl!==null?cumpl+'%':'',wh]);
    row.eachCell(c=>{c.alignment={wrapText:true,vertical:'top',horizontal:'left'};c.border={top:{style:'thin',color:{argb:'FFE5E7EB'}},bottom:{style:'thin',color:{argb:'FFE5E7EB'}},left:{style:'thin',color:{argb:'FFE5E7EB'}},right:{style:'thin',color:{argb:'FFE5E7EB'}}};c.font=c.font||{size:9};});
    row.getCell(1).font={bold:true,size:10};
    row.height=Math.max(20,15*maxLines);
  });
  ws.columns=[{width:18},{width:14},{width:24},...days.map(()=>({width:22})),{width:9},{width:9},{width:9},{width:8}];
  ws.views=[{state:'frozen',ySplit:4,xSplit:3}];
  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='Reporte_Semanal_Lukmar_Semana'+wkNum(wkStart(planWkOff))+'.xlsx';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}

// SAVE/LOAD
function buildStatePayload(){
  return {ponds,PR_data:PR.map(p=>({id:p.id,ha:p.ha,sector:p.sector,desc:p.desc})),maquinas,agenda,combustible,mantenimiento,weekCycles,weekCyclesPond,horasPlan,operarios,opNid,SECS_EX:[...SECS_EXTRA],nid,mantNid,savedAt:new Date().toISOString()};
}
function applyStatePayload(data){
  if(!data)return false;
  if(data.ponds){Object.keys(data.ponds).forEach(pid=>{if(!ponds[pid])ponds[pid]={maqIds:[],tasks:{},operario:'',fechaInicio:'',fechaFin:'',mlPlanificados:0,notas:''};
    const old=data.ponds[pid];
    if(old.tasks){ponds[pid]=old;if(!ponds[pid].maqIds)ponds[pid].maqIds=Object.keys(ponds[pid].tasks).map(Number);}
    else{
      // Migración de esquema antiguo (estado único por piscina) a estado por máquina
      const tasks={};(old.maqIds||[]).forEach(mid=>{tasks[mid]={status:old.status||'pendiente',notas:''};});
      ponds[pid]={maqIds:old.maqIds||[],tasks,operario:old.operario||'',fechaInicio:old.fechaInicio||'',fechaFin:old.fechaFin||'',mlPlanificados:old.mlPlanificados||0,notas:old.notas||''};
    }
  });}
  if(data.PR_data){data.PR_data.forEach(p=>{const found=PR.find(x=>x.id===p.id);if(found){found.ha=p.ha;if(p.sector)found.sector=p.sector;if(p.desc)found.desc=p.desc;}else if(p.id){PR.push({id:p.id,ha:p.ha,sector:p.sector,desc:p.desc});if(!ponds[p.id])ponds[p.id]={maqIds:[],tasks:{},operario:'',fechaInicio:'',fechaFin:'',mlPlanificados:0,notas:''};}})}
  if(data.maquinas&&data.maquinas.length)maquinas=data.maquinas;
  if(data.agenda)agenda=data.agenda;
  if(data.combustible)combustible=data.combustible;
  if(data.mantenimiento)mantenimiento=data.mantenimiento;
  if(data.weekCycles)weekCycles=data.weekCycles;
  if(data.weekCyclesPond)weekCyclesPond=data.weekCyclesPond;
  if(data.operarios)operarios=data.operarios;
  if(data.opNid)opNid=data.opNid;
  if(data.horasPlan)horasPlan=data.horasPlan;
  if(data.SECS_EX)data.SECS_EX.forEach(s=>{if(!SECS_EXTRA.includes(s))SECS_EXTRA.push(s);});
  if(data.nid)nid=data.nid;if(data.mantNid)mantNid=data.mantNid;
  return data.savedAt;
}
let _sbSyncTimer=null;
function syncToSupabase(payload){
  if(!sbClient)return;
  clearTimeout(_sbSyncTimer);
  _sbSyncTimer=setTimeout(async()=>{
    try{
      const{error}=await sbClient.from('app_state').upsert({id:'lukmar',data:payload,updated_at:new Date().toISOString()});
      if(error){console.error('Supabase sync error:',error);showSave('Guardado local (sin nube)');}
      else showSave('Sincronizado con Supabase');
    }catch(e){console.error(e);}
  },600);
}
async function loadFromSupabaseAndRefresh(){
  if(!sbClient)return;
  try{
    const{data,error}=await sbClient.from('app_state').select('data,updated_at').eq('id','lukmar').maybeSingle();
    if(error){console.error('Supabase load error:',error);return;}
    if(data&&data.data){
      applyStatePayload(data.data);
      localStorage.setItem(SAVE_KEY,JSON.stringify(data.data));
      sw(curTab||'resumen');
      showSave('Datos actualizados desde Supabase');
    } else {
      saveAll();
    }
  }catch(e){console.error(e);}
}
function saveAll(){
  if(!document.getElementById('save-ind'))return;
  try{
    const payload=buildStatePayload();
    localStorage.setItem(SAVE_KEY,JSON.stringify(payload));
    showSave('Guardado');
    syncToSupabase(payload);
  }catch(e){showSave('Error al guardar');}
}
function loadAll(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);if(!raw)return false;
    const data=JSON.parse(raw);
    return applyStatePayload(data);
  }catch(e){console.error(e);return false;}
}
function showSave(msg){const el=document.getElementById('save-ind');if(!el)return;el.textContent=msg;el.style.opacity='1';setTimeout(()=>el.style.opacity='0',2500);}
function exportData(){const d=localStorage.getItem(SAVE_KEY);if(!d){alert('Sin datos aún.');return;}const b=new Blob([d],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='lukmar_backup_'+todayYmd()+'.json';a.click();URL.revokeObjectURL(u);}
function importData(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{localStorage.setItem(SAVE_KEY,ev.target.result);alert('Importado. Recargando...');location.reload();}catch(err){alert('Error: '+err.message);}};r.readAsText(f);};i.click();}

function refresh(){
  const tabs=TABS;
  const idx=[...document.querySelectorAll('.nb')].indexOf(document.querySelector('.nb.active'));
  if(idx>=0)sw(tabs[idx]);
  saveAll();
}
