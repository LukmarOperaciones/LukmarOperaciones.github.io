<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUKMAR · Portada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1E4696;
  --navy-2:#153268;
  --navy-3:#0F2450;
  --blue-mid:#2E76A6;
  --blue-light:#BFE1F0;
  --blue-bg:#E8F3F9;
  --orange:#DE7A3C;
  --orange-dark:#C4642A;
  --orange-bg:#FBEADC;
  --bg:#EFF4F8;
  --surface:#FFFFFF;
  --muted:#647085;
  --border:#DCE6EC;
  --font-display:'Oswald',sans-serif;
  --font-body:'Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:var(--font-body);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle at 20% 15%, var(--blue-mid) 0%, var(--navy) 45%, var(--navy-3) 100%);
  padding:24px;
}
.card{
  width:100%;
  max-width:760px;
  background:var(--surface);
  border-radius:18px;
  box-shadow:0 25px 60px rgba(15,36,80,.35);
  overflow:hidden;
}
.card-header{
  background:var(--navy-3);
  background-image:linear-gradient(135deg, var(--navy) 0%, var(--navy-3) 100%);
  padding:38px 40px 34px;
  text-align:center;
  position:relative;
}
.logo-badge{
  background:#fff;
  border-radius:14px;
  width:110px;
  height:110px;
  margin:0 auto 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 20px rgba(0,0,0,.18);
}
.logo-badge img{
  width:80%;
  max-width:86px;
  display:block;
}
.card-header h1{
  font-family:var(--font-display);
  color:#fff;
  font-size:30px;
  letter-spacing:1px;
  font-weight:600;
}
.card-header .tag{
  color:var(--blue-light);
  font-size:13px;
  margin-top:6px;
  letter-spacing:.5px;
}
.body{
  padding:34px 40px 40px;
}
.user-info{
  display:flex;
  align-items:center;
  gap:14px;
  background:var(--blue-bg);
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px 18px;
  margin-bottom:30px;
}
.avatar{
  width:46px;
  height:46px;
  border-radius:50%;
  background:var(--navy);
  color:#fff;
  font-family:var(--font-display);
  font-size:17px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.user-info .name{
  font-weight:600;
  color:var(--navy-3);
  font-size:15px;
}
.user-info .role{
  color:var(--muted);
  font-size:13px;
  margin-top:1px;
}
.section-title{
  font-family:var(--font-display);
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:1.2px;
  color:var(--muted);
  margin-bottom:14px;
  text-align:center;
}
.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}
.btn{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  text-decoration:none;
  padding:28px 16px;
  border-radius:14px;
  font-family:var(--font-display);
  font-size:16px;
  letter-spacing:.3px;
  transition:transform .15s ease, box-shadow .15s ease;
  border:1px solid transparent;
}
.btn:hover{
  transform:translateY(-3px);
}
.btn .icon{
  width:46px;
  height:46px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.btn .icon svg{width:100%;height:100%;}
.btn-maquinaria{
  background:var(--blue-bg);
  color:var(--navy-3);
  border-color:var(--blue-light);
}
.btn-maquinaria:hover{
  box-shadow:0 12px 24px rgba(46,118,166,.25);
  background:var(--blue-light);
}
.btn-obras{
  background:var(--orange-bg);
  color:var(--orange-dark);
  border-color:#f0c9a6;
}
.btn-obras:hover{
  box-shadow:0 12px 24px rgba(222,122,60,.25);
  background:#f6d8bc;
}
.footer{
  text-align:center;
  padding:18px 20px 26px;
  color:var(--muted);
  font-size:12px;
}
@media (max-width:520px){
  .buttons{grid-template-columns:1fr;}
  .card-header{padding:30px 24px 26px;}
  .body{padding:28px 24px 32px;}
}
</style>
